name: Build iOS Dylib Mods

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "mods/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-dylibs:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build All hnmods to iOS arm64 dylib
        run: |
          chmod +x scripts/build_all_mods.sh
          ./scripts/build_all_mods.sh

      - name: Archive Dylibs
        run: |
          cd artifacts
          zip -r ../horizon-dylib-mods-arm64.zip *.dylib || echo "No dylibs found"
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-dylib-mods-arm64
          path: |
            artifacts/*.dylib
            horizon-dylib-mods-arm64.zip
          if-no-files-found: warn
